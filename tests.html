<script>
FC.AI.depth = 1;   // массовые партии — быстрая оценка на 1 ход (поиск на 3 хода проверяется отдельным тестом)

const GAMES = 2, MAX_PLIES = 200;
const ids = Object.keys(FC.FACTIONS);
const res = { errors: [], rows: [] };
function play(f0, f1, smart) {
  const G = new FC.Game(f0, f1);
  G.turn = Math.random() < .5 ? 0 : 1;
  for (let i = 0; i < MAX_PLIES && G.winner == null; i++) {
    let a;
    if (smart) a = FC.AI.choose(G, G.turn);
    else { const acts = G.allActions(G.turn); a = acts[Math.floor(Math.random() * acts.length)]; }
    if (!a) break;
    G.doAction(a);
    let p, guard = 0;
    while (G.winner == null && (p = G.nextPending()) && guard++ < 20) G.resolvePending(FC.AI.resolve(G, p));
    G.queue = [];
    if (G.winner == null) G.endTurn();
    // инварианты
    for (const o of [0, 1]) if (G.winner == null && !G.leader(o)) throw new Error('Лидер исчез без победы');
    const ids2 = G.allPieces().map(o => o.p.id); if (new Set(ids2).size !== ids2.length) throw new Error('Дубль фигуры');
  }
  return G;
}
/* ---- точечные проверки правил ---- */
function empty(f0, f1) { const G = new FC.Game(f0, f1); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) G.board[y][x] = null; return G; }
const at = (G, x, y) => G.legalActionsFor(x, y, 'normal').acts.concat(G.legalActionsFor(x, y, 'special').acts);
const CHECKS = [
  ['Король не может ходить под шах', () => {
    const G = empty('humans', 'humans'); G.spawn('king', 0, 4, 0); G.spawn('king', 1, 4, 7); G.spawn('rook', 1, 3, 7);
    return !at(G, 4, 0).some(a => a.x === 3 && (a.kind === 'move' || a.kind === 'capture'));
  }],
  ['Нельзя оставлять лидера под шахом (связка)', () => {
    const G = empty('humans', 'humans'); G.spawn('king', 0, 4, 0); G.spawn('rook', 0, 4, 1); G.spawn('king', 1, 0, 7); G.spawn('rook', 1, 4, 7);
    return at(G, 4, 1).every(a => a.x === 4);
  }],
  ['Лидер под шахом может уничтожить атакующего особой атакой', () => {
    const G = empty('orcs', 'humans'); G.spawn('shaman', 0, 6, 1); G.spawn('king', 1, 3, 7); G.spawn('queen', 1, 6, 3);
    return G.leaderThreatened(0) && G.legalActionsFor(6, 1, 'special').acts.some(a => a.kind === 'ranged' && a.x === 6 && a.y === 3);
  }],
  ['Ничья при троекратном повторении позиции', () => {
    const G = empty('humans', 'humans'); G.spawn('king', 0, 0, 0); G.spawn('king', 1, 7, 7); G.spawn('rook', 0, 3, 3); G.spawn('rook', 1, 4, 4);
    const mv = (fx, fy, tx, ty) => { G.doAction(G.legalActionsFor(fx, fy, 'normal').acts.find(a => a.x === tx && a.y === ty)); G.endTurn(); };
    // ладьи ходят туда-обратно: позиции повторяются
    const seq = [[3, 3, 3, 2], [4, 4, 4, 5], [3, 2, 3, 3], [4, 5, 4, 4], [3, 3, 3, 2], [4, 4, 4, 5], [3, 2, 3, 3], [4, 5, 4, 4], [3, 3, 3, 2]];
    let i = 0; for (; i < seq.length && G.winner == null; i++) mv(...seq[i]);
    return G.winner === -1 && /повторилась/.test(G.winReason) && i === 9;
  }],
  ['Ничья после 50 ходов без взятий', () => {
    const G = empty('humans', 'humans'); G.spawn('king', 0, 0, 0); G.spawn('king', 1, 7, 7); G.spawn('rook', 0, 3, 3);
    G.quietPlies = 99;
    G.doAction(G.legalActionsFor(3, 3, 'normal').acts.find(a => a.kind === 'move')); G.endTurn();
    const drawn = G.winner === -1 && /50 ходов/.test(G.winReason);
    const H = empty('humans', 'humans'); H.spawn('king', 0, 0, 0); H.spawn('king', 1, 7, 7); H.spawn('rook', 0, 3, 3); H.spawn('pawn', 1, 3, 6);
    H.quietPlies = 99;
    H.doAction(H.legalActionsFor(3, 3, 'normal').acts.find(a => a.kind === 'capture')); H.endTurn();
    return drawn && H.winner == null && H.quietPlies === 0;
  }],
  ['Мат завершает партию', () => {
    // шах конём (призыв пешки не закрывает) + ладьи держат все поля отступления
    const G = empty('humans', 'humans'); G.spawn('king', 0, 0, 0); G.spawn('king', 1, 7, 7); G.spawn('knight', 1, 1, 2); G.spawn('rook', 1, 7, 0); G.spawn('rook', 1, 6, 1);
    G.turn = 1; G.endTurn(); return G.winner === 1 && /Мат/.test(G.winReason);
  }],
  ['Король демонов может вставать под удар', () => {

    return at(G, 4, 3).some(a => a.x === 3 && a.y === 3);
  }],
  ['Возрождение Короля демонов занимает ход', () => {

  ['Без жертвы Демоны проигрывают', () => {

  ['У каждой фигуры Демонов свой похищенный ход', () => {

  ['Отмена хода восстанавливает позицию', () => {
    const G = new FC.Game('orcs', 'undead'); const before = JSON.stringify(G.board);
    for (let i = 0; i < 6 && G.winner == null; i++) { const a = FC.AI.choose(G, G.turn); if (!a) break; G.doAction(a); let p; while ((p = G.nextPending())) G.resolvePending(FC.AI.resolve(G, p)); G.endTurn(); }

  ['Ход вперёд возвращает отменённые ходы', () => {

    const end = JSON.stringify(G.board), logs = G.logs.join('|'), tn = G.turnNo;
    while (G.undo()); while (G.redo());
    const ok1 = JSON.stringify(G.board) === end && G.logs.join('|') === logs && G.turnNo === tn;
    G.undo(); G.undo(); const a = FC.AI.choose(G, G.turn); G.doAction(a);
    return ok1 && G.future.length === 0;
  }],
  ['Орки: Орк-воин ходит на 5; двойной прорыв у Орка-воина, Вождя и Плута', () => {
    const G = empty('orcs', 'humans'); G.spawn('shaman', 0, 7, 0); G.spawn('king', 1, 7, 7); G.spawn('orc_warrior', 0, 0, 0);
    const ys = at(G, 0, 0).filter(a => a.x === 0).map(a => a.y);
    G.spawn('pawn', 1, 0, 2); G.spawn('pawn', 1, 0, 4);
    const w = G.legalActionsFor(0, 0, 'special').acts.find(a => a.hits && a.hits.length === 2 && a.x === 0 && a.y === 4); if (!w) return false;

    const H = empty('orcs', 'humans'); H.spawn('shaman', 0, 7, 0); H.spawn('king', 1, 7, 7); H.spawn('chief', 0, 3, 0); H.spawn('pawn', 1, 3, 2); H.spawn('pawn', 1, 3, 4);
    const ch = H.legalActionsFor(3, 0, 'special').acts.some(a => a.hits && a.hits.length === 2 && a.x === 3 && a.y === 4);
    const R = empty('orcs', 'humans'); R.spawn('shaman', 0, 7, 0); R.spawn('king', 1, 7, 7); R.spawn('rogue', 0, 0, 0); R.spawn('pawn', 1, 1, 1); R.spawn('pawn', 1, 3, 3);
    const ro = R.legalActionsFor(0, 0, 'special').acts.find(a => a.hits && a.hits.length === 2 && a.x === 3 && a.y === 3); if (!ro) return false;

  ['Гоблин-плут: как слон, прыгает только через своих, «Прорыв» с шагом вперёд', () => {
    const G = empty('orcs', 'humans'); G.spawn('shaman', 0, 7, 0); G.spawn('king', 1, 7, 7);

  }],
  ['Хоп-гоблин ест две фигуры вплотную', () => {
    const G = empty('orcs', 'humans'); G.spawn('shaman', 0, 7, 0); G.spawn('king', 1, 7, 7); G.spawn('hop_goblin', 0, 3, 2); G.spawn('pawn', 1, 3, 3); G.spawn('pawn', 1, 3, 4);
    const a = at(G, 3, 2).find(a => a.hits && a.hits.length === 2); if (!a) return false;

  ['Гоблин, Плут и Всадник не едят две фигуры', () => {

    G.spawn('goblin', 0, 0, 2); G.spawn('pawn', 1, 0, 3); G.spawn('pawn', 1, 0, 4);

  ['Орки не берут лидера вторым взятием', () => {

    const noDouble = !G.legalActionsFor(3, 2, 'normal').acts.concat(G.legalActionsFor(3, 2, 'special').acts).some(a => a.hits && a.hits.some(h => h[0] === 3 && h[1] === 4));
    return noDouble && !G.leaderThreatened(1);
  }],
  ['Всадник: нет прыжка «2 вперёд + 1 вбок», есть «3 вперёд + 1 вбок»', () => {
    const G = empty('orcs', 'humans'); G.spawn('shaman', 0, 7, 0); G.spawn('king', 1, 7, 7); G.spawn('rider', 0, 3, 3);
    const t = new Set(at(G, 3, 3).map(a => (a.x - 3) + ',' + (a.y - 3)));
    const B = new FC.Game('humans', 'orcs'); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) B.board[y][x] = null;

    const tb = new Set(at(B, 3, 4).map(a => (a.x - 3) + ',' + (a.y - 4)));
    return !t.has('1,2') && !t.has('-1,2') && t.has('1,3') && t.has('-1,3') && t.has('2,1') && t.has('-2,1')
      && !tb.has('1,-2') && tb.has('1,-3') && tb.has('2,-1');
  }],
  ['Король людей призывает Пешку вместо хода', () => {
    const G = empty('humans', 'orcs'); G.spawn('king', 0, 4, 0); G.spawn('shaman', 1, 7, 7); G.spawn('pawn', 0, 4, 1);

  ['Призыв Пешек: не больше 8 на доске', () => {

    G.doAction(G.legalActionsFor(3, 4, 'normal').acts.find(a => a.kind === 'capture' && a.x === 6 && a.y === 4));
    const p = G.nextPending(); if (!p || p.owner !== 0 || p.kind !== 'cells') return false;
    const ok = p.cells.every(c => Math.max(Math.abs(c.x - 6), Math.abs(c.y - 1)) === 1);                     // у Обелиска, ближайшего к месту взятия
    G.resolvePending(p.cells[0]);
    return ok && G.pieces(0).filter(o => o.p.type === 'imp').length === 1;
  }],
  ['Демоны: нет Импа за взятие Импом и за потерю своей фигуры', () => {
    const G = empty('demons', 'humans'); G.spawn('summoner', 0, 0, 0); G.spawn('obelisk', 0, 6, 1);
    G.spawn('imp', 0, 3, 3); G.spawn('pawn', 1, 4, 4); G.spawn('king', 1, 7, 7); G.spawn('rook', 1, 0, 6); G.spawn('guard', 0, 0, 3);
    G.doAction(G.legalActionsFor(3, 3, 'normal').acts.find(a => a.kind === 'capture' && a.x === 4 && a.y === 4));
    const impKill = !!G.nextPending();
    G.endTurn();
    G.doAction(G.legalActionsFor(0, 6, 'normal').acts.find(a => a.kind === 'capture' && a.x === 0 && a.y === 3));   // враг берёт Стража
    return !impKill && !G.nextPending() && G.pieces(0).filter(o => o.p.type === 'imp').length === 1;

  ['Демоны: нет шаха и мата — Призыватель может ходить под удар', () => {
    const G = empty('demons', 'humans'); G.spawn('summoner', 0, 0, 0); G.spawn('king', 1, 7, 7); G.spawn('rook', 1, 1, 7); G.spawn('rook', 1, 7, 0);
    // Призыватель «под шахом» ладьи 7,0 и все соседние поля бьются — у обычного лидера это мат
    const free = G.legalActionsFor(0, 0, 'normal').acts.some(a => a.x === 1 && a.y === 0);
    G.turn = 1; G.endTurn();
    return !G.leaderThreatened(0) && free && G.winner == null;
  }],
  ['Демоны: Призыватель взят, Король жив — игра идёт; Король взят — поражение', () => {
    const G = empty('demons', 'humans'); G.spawn('summoner', 0, 0, 0); G.spawn('demon_king', 0, 4, 3); G.spawn('guard', 0, 4, 0);
    G.spawn('king', 1, 7, 7); G.spawn('rook', 1, 0, 7); G.spawn('rook', 1, 4, 7); G.turn = 1;
    G.doAction(G.legalActionsFor(0, 7, 'normal').acts.find(a => a.kind === 'capture' && a.x === 0 && a.y === 0));
    if (G.winner != null || G.players[0].reviveDue) return false;
    G.endTurn();
    if (G.leader(0).p.type !== 'demon_king') return false;
    // свой Страж не может взять последнего лидера
    if (G.legalActionsFor(4, 0, 'normal').acts.some(a => a.x === 4 && a.y === 3)) return false;
    G.turn = 1;
    G.doAction(G.legalActionsFor(4, 7, 'normal').acts.find(a => a.kind === 'capture' && a.x === 4 && a.y === 3));
    return G.winner === 1;
  }],
  ['Демоны: Король пал, затем взят Призыватель — поражение', () => {
    const G = empty('demons', 'humans'); G.spawn('summoner', 0, 0, 0); G.spawn('demon_king', 0, 4, 4); G.spawn('imp', 0, 1, 0);
    G.spawn('king', 1, 7, 7); G.spawn('rook', 1, 4, 7); G.spawn('rook', 1, 0, 7); G.turn = 1;
    G.doAction(G.legalActionsFor(4, 7, 'normal').acts.find(a => a.kind === 'capture' && a.x === 4 && a.y === 4));
    if (G.winner != null || !G.players[0].reviveDue) return false;
    G.doAction(G.legalActionsFor(0, 7, 'normal').acts.find(a => a.kind === 'capture' && a.x === 0 && a.y === 0));
    return G.winner === 1;
  }],
  ['Нежить: Кладбище берёт врага на соседней клетке', () => {
    const G = empty('undead', 'humans'); G.spawn('phylactery', 0, 0, 0); G.spawn('king', 1, 7, 7);
    G.spawn('graveyard', 0, 3, 3); G.spawn('knight', 1, 4, 4); G.spawn('skeleton', 0, 2, 2);

    const cap = acts.find(a => a.kind === 'capture' && a.x === 4 && a.y === 4);
    if (!cap || acts.some(a => a.x === 2 && a.y === 2)) return false;   // своего не берёт
    G.doAction(cap);
    return G.at(4, 4) && G.at(4, 4).type === 'graveyard';
  }],
  ['Нежить: Кладбище воскрешает фигуру из пула', () => {
    const G = empty('undead', 'humans'); G.spawn('phylactery', 0, 0, 0); G.spawn('king', 1, 7, 7);
    G.spawn('death_knight', 0, 3, 3); G.spawn('knight', 1, 3, 6); G.spawn('graveyard', 0, 5, 1);
    G.doAction(G.legalActionsFor(3, 3, 'normal').acts.find(a => a.kind === 'capture' && a.x === 3 && a.y === 6));
    if (G.players[0].pool.join() !== 'soul_eater') return false;                                              // конь → Пожиратель душ в пуле
    G.endTurn(); G.turn = 0;
    const rv = G.legalActionsFor(5, 1, 'special').acts.filter(a => a.kind === 'revive');
    if (rv.length !== 3) return false;                                                                        // 3 клетки перед Кладбищем

    const p = G.at(5, 2);
    return p && p.type === 'soul_eater' && p.owner === 0 && G.players[0].pool.length === 0
      && G.legalActionsFor(5, 1, 'special').acts.every(a => a.kind !== 'revive');
  }],
  ['Нежить: при 12 Скелетах — предупреждение', () => {
    const G = empty('undead', 'humans'); G.spawn('phylactery', 0, 0, 0); G.spawn('king', 1, 7, 7); G.spawn('graveyard', 0, 4, 2);
    for (let i = 0; i < 12; i++) G.spawn('skeleton', 0, i % 4, 4 + Math.floor(i / 4));
    const c = G.legalActionsFor(4, 2, 'special');
    return (c.warns || []).some(w => /больше 12 Скелетов/.test(w));
  }],
  ['Шаман: дальняя атака на 2', () => {
    const G = empty('orcs', 'humans'); G.spawn('shaman', 0, 4, 0); G.spawn('king', 1, 7, 7); G.spawn('pawn', 1, 4, 2);
    return G.legalActionsFor(4, 0, 'special').acts.some(a => a.kind === 'ranged' && a.y === 2);
  }],
  ['Лич не берёт обычные фигуры', () => {
    const G = empty('undead', 'orcs'); G.spawn('phylactery', 0, 0, 0); G.spawn('shaman', 1, 7, 7); G.spawn('lich', 0, 3, 0); G.spawn('goblin', 1, 3, 5);
    return !G.legalActionsFor(3, 0, 'normal').acts.some(a => a.kind === 'capture' || (a.x === 3 && a.y === 5));
  }],
  ['Лич берёт ферзя и ставит шах', () => {
    const G = empty('undead', 'orcs'); G.spawn('phylactery', 0, 0, 0); G.spawn('shaman', 1, 7, 7); G.spawn('lich', 0, 3, 0); G.spawn('chief', 1, 3, 5);
    const takesQueen = G.legalActionsFor(3, 0, 'normal').acts.some(a => a.kind === 'capture' && a.x === 3 && a.y === 5);
    const G2 = empty('undead', 'orcs'); G2.spawn('phylactery', 0, 0, 0); G2.spawn('shaman', 1, 7, 7); G2.spawn('lich', 0, 7, 2);
    return takesQueen && G2.leaderThreatened(1);
  }],
  ['Лич превращает фигуру', () => {
    const G = empty('undead', 'orcs'); G.spawn('phylactery', 0, 0, 0); G.spawn('shaman', 1, 7, 7); G.spawn('lich', 0, 3, 0); G.spawn('goblin', 1, 3, 5);
    G.doAction(G.legalActionsFor(3, 0, 'special').acts[0]); return G.at(3, 5).owner === 0 && G.at(3, 5).type === 'skeleton' && G.at(3, 4).type === 'lich';
  }],
];
setTimeout(() => {
  const checks = CHECKS.map(([n, f]) => { let ok; try { ok = f(); } catch (e) { ok = false; n += ' — ' + e.message; } return [n, ok]; });
  const failed = checks.filter(c => !c[1]).length;
  document.body.insertAdjacentHTML('beforeend', `<h3>Проверки правил: ${checks.length - failed}/${checks.length}</h3>` + checks.map(([n, ok]) => `<div class="${ok ? '' : 'err'}">${ok ? '✔' : '✘'} ${n}</div>`).join(''));
  window.CHECKS_RESULT = { failed, list: checks };
  const t0 = performance.now();
  for (const a of ids) for (const b of ids) {
    const row = { a, b, w0: 0, w1: 0, draw: 0, plies: 0 };
    for (let g = 0; g < GAMES; g++) {
      try {
        const G = play(a, b, g % 2 === 1);
        if (G.winner === 0) row.w0++; else if (G.winner === 1) row.w1++; else row.draw++;
        row.plies += G.turnNo;
      } catch (e) { res.errors.push(`${a} vs ${b}: ${e.message}\n${e.stack}`); }
    }
    res.rows.push(row);
  }
  const ms = Math.round(performance.now() - t0);
  window.TEST_RESULT = { errors: res.errors.length, ms };
  document.getElementById('out').innerHTML =
    `<p>Партий: ${ids.length * ids.length * GAMES}, время ${ms} мс, ошибок: <b class="${res.errors.length ? 'err' : ''}">${res.errors.length}</b></p>` +
    res.errors.map(e => `<pre class="err">${e}</pre>`).join('') +
    '<table><tr><th>Белые</th><th>Чёрные</th><th>Победы б.</th><th>Победы ч.</th><th>Без итога</th><th>Ср. ходов</th></tr>' +
    res.rows.map(r => `<tr><td>${FC.FACTIONS[r.a].name}</td><td>${FC.FACTIONS[r.b].name}</td><td>${r.w0}</td><td>${r.w1}</td><td>${r.draw}</td><td>${Math.round(r.plies / GAMES)}</td></tr>`).join('') + '</table>';
}, 50);
</script>
